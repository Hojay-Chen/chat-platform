# 伴侣平台 (companion.luxera.top)
#
# 前后端分离配置(与 blog.conf 同模式):
#   - 公网: 前端静态页面 (SPA)
#   - 内网: /api 代理到后端 (Spring Boot :8081)
#
# 注意: 聊天是 SSE 流式, /api 必须 proxy_buffering off 才能逐 token 推送

# ── HTTP → HTTPS ───────────────────────────
server {
    listen 80;
    server_name companion.luxera.top;
    return 301 https://companion.luxera.top$request_uri;
}

# ── companion.luxera.top → 伴侣平台 ──────────
server {
    listen 443 ssl;
    server_name companion.luxera.top;

    ssl_certificate     /etc/nginx/ssl/luxera-top/luxera-top.crt;
    ssl_certificate_key /etc/nginx/ssl/luxera-top/luxera-top.key;

    # 前端静态文件 (Vite build 产物)
    root /var/www/companion;
    index index.html;

    # ── 仿真 Agent 平台 (仓 2 server:8091) — G5 分流的生产落点 ──────────
    #
    # G5 把前端按"路径段"分流: 伴侣域(companions/memories/relationship/state/…)
    # 加 /agent 前缀 → 8091, 其余(auth/会话/消息/事件流/应用)留在 /api → 8081。
    # vite dev 用 rewrite 去前缀, 生产必须由 nginx 做同一件事 —— 这就是 G5
    # README 里那句"G7 生产 nginx 同一套前缀规则"的落点。少了这一段, dev 一切
    # 正常而线上伴侣域全 404。
    #
    # 前缀匹配里 /agent/api/ 比 /api/ 长, 因此天然优先, 不会抢走普通 /api 请求。
    location /agent/api/ {
        rewrite ^/agent/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 8091 侧同样有 SSE(认知链事件), 与 /api/ 一致关缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API → Spring Boot 后端 (内网, SSE 流式)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式聊天必须关缓冲,否则 token 不会实时到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 静态资源带 hash 长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
