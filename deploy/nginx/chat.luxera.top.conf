# 伴侣平台 (chat.luxera.top)
#
# 前后端分离配置(与 blog.conf 同模式):
#   - 公网: 前端静态页面 (SPA)
#   - 内网: /api 代理到后端 (Spring Boot :8081)
#
# 注意: 聊天是 SSE 流式, /api 必须 proxy_buffering off 才能逐 token 推送

# ── HTTP → HTTPS ───────────────────────────
server {
    listen 80;
    server_name chat.luxera.top;
    return 301 https://chat.luxera.top$request_uri;
}

# ── chat.luxera.top → 伴侣平台 ──────────
server {
    listen 443 ssl;
    server_name chat.luxera.top;

    ssl_certificate     /etc/nginx/ssl/luxera-top/luxera-top.crt;
    ssl_certificate_key /etc/nginx/ssl/luxera-top/luxera-top.key;

    # 前端静态文件 (Vite build 产物)
    root /var/www/companion;
    index index.html;

    # 这里曾有 `location /agent/api/` → 8091(G5 分流的生产落点)。已删除。
    #
    # 它把仿真 Agent 平台暴露成了浏览器可见的第二套 API: 聊天前端按"路径段"给
    # 伴侣域请求加 /agent 前缀直奔 8091, 于是"聊天平台的界面"实际由两个后端的
    # API 并集拼成。而按段判归属是错的 —— conversations 段两端都有端点:
    #   GET  /api/companions/{id}/conversations            → 8081
    #   POST /api/companions/{id}/conversations/first      → 8091(开/复用会话)
    #   POST /api/companions/{id}/conversations/{cid}/chat → 8091(SSE)
    #   POST /api/companions/{id}/conversations/{cid}/chat → 8091(SSE)
    # 段规则把整段判给 8081, 流式聊天入口因此 404。
    #
    # 现在伴侣域由 8081 在服务端转发(CompanionDomainProxyController), 归属依据是
    # "8081 究竟实现了哪些端点"而非路径段。nginx 这一层不再需要知道 8091 存在:
    # 所有 /api/** 一个去处 —— 这正是"聊天平台一个域名, 前端只调聊天平台后端"。
    # 若要回滚, 注意 8091 也在新域名 being.luxera.top 下, 不是靠这段暴露的。

    # API → Spring Boot 后端 (内网, SSE 流式)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式聊天必须关缓冲,否则 token 不会实时到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 静态资源带 hash 长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
