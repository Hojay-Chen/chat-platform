// chat —— 聊天平台主体, 也是**服务的启动项目**。
//
// ChatPlatformApplication（src/main/java/com/luxera/chatserver/ChatPlatformApplication.java）
// 扫描聊天 + 应用两个平台 + common 的包, 打成一个可执行 fat jar:
// 这就是"聊天平台与应用平台同进程, 由聊天平台启动"的物理形态。
//
// 对外端口不变: 8081 / companion.luxera.top —— nginx 与 systemd 无需感知这次拆分。

plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':contract')
    implementation project(':common')
    implementation project(':application')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
}

bootJar {
    archiveBaseName = 'chat-platform'
    archiveVersion = '1.0.0'
    mainClass = 'com.luxera.chatserver.ChatPlatformApplication'
}
